<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="coffee.json">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/ico.ico">
    <link rel="stylesheet" href="../css/ciessesse.css">
    <title>Coffee</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }

        #mainContainer {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .page {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1),
                        opacity 0.4s cubic-bezier(0.4, 0.0, 0.2, 1) 0.25s;
            overflow: hidden;
        }

        .page.exiting {
            transition: transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1),
                        opacity 0.15s cubic-bezier(0.4, 0.0, 0.2, 1) !important;
        }

        .page.screen-1 {
            transform: translateY(0);
            opacity: 1;
        }

        .page.screen-2 {
            transform: translateY(100%);
            opacity: 0;
        }

        .page.screen-3 {
            transform: translateY(200%);
            opacity: 0;
        }

        .page.screen-4 {
            transform: translateY(300%);
            opacity: 0;
        }

        .blogpost {
            max-width: 800px;
            text-align: center;
            padding: 10px;
        }

        .meteo-container {
            margin: 20px;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .radar {
            font-size: 15px !important;
            height: 30px !important;
            border-radius: 50% !important;
            width: 30px !important;
        }

        .toggle-btn {
            background: linear-gradient(135deg, #1a5fb4 0%, #3584e4 100%);
            color: white;
            padding: 0;
            border: none;
            border-radius: 30%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 22px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(26, 95, 180, 0.3);
            position: relative;
            overflow: hidden;
        }

        .toggle-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 30%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        .toggle-btn:hover::before {
            width: 100%;
            height: 100%;
        }

        .toggle-btn:hover {
            box-shadow: 0 6px 20px rgba(26, 95, 180, 0.5);
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #3584e4 0%, #62a0ea 100%);
            box-shadow: 0 0 0 4px rgba(26, 95, 180, 0.2);
            transform: scale(1.05);
        }

        .toggle-btn span {
            position: relative;
            z-index: 1;
        }

        .train-btn {
            width: auto;
            height: 25px;
            padding: 0 10px;
            font-size: 15px;
            border-radius: 10px;
            background: linear-gradient(135deg, #c01c28 0%, #e01b24 100%);
        }

        .widget-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            display: flex;
            justify-content: center;
        }

        .widget-wrapper.show {
            max-height: 600px;
        }

        .screen-two-content {
            color: white;
        }

        .fumetto {
            position: absolute;
            background: white;
            color: #1a5fb4;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 9s cubic-bezier(.55,.06,.68,.19);
            bottom: 60px;
            right: 83px;
        }

        .fumetto.show {
            opacity: 1;
        }

        .train-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .train-row {
            display: flex;
            gap: 10px;
        }

        /* ==== Timer pomodoro, importato da Covatta ==========================
           Colori, animazioni e comportamento sono quelli di là. Cambia solo la
           forma: la card rettangolare diventa un cerchio, la barra di
           avanzamento lineare diventa un anello che in un lavoro intero compie
           360°, e il comando "modifica" esce dal cerchio e si appoggia sotto. */
        :root {
            --crema: #f9f7d7;
            --carta: #fffdf3;
            --inchiostro: #2b2a1f;
            --oro: #a89968;
            --bordo: #e5dfae;
            /* Diametro dei cerchi a tutta schermata — il timer e il video dei
               pesci. Sta qui perché i due devono restare della stessa misura:
               si cambia in un posto solo. */
            --diametro-cerchio: min(78vw, 58vh, 380px);
        }

        /* Su Covatta il box-sizing:border-box è globale e il pomodoro ci conta.
           Qui quella regola non esiste, quindi la si ricrea sul solo sottoalbero
           del timer, per non cambiare le misure di meteo e treni. */
        #pomodoro-blocco, #pomodoro-blocco * { box-sizing: border-box; }

        /* Il blocco contiene un solo elemento nel flusso, il cerchio: "modifica"
           ne è fuori. L'altezza del blocco è quindi quella del cerchio soltanto,
           ed è il cerchio — non l'insieme dei due — a finire esattamente al
           centro verticale della schermata. Il position:relative serve a fare da
           riferimento a "modifica", che si aggancia al bordo di sopra. */
        #pomodoro-blocco {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--inchiostro);
        }

        /* Il cerchio è la card di Covatta con il raggio portato al massimo.
           Il padding laterale in percentuale tiene il contenuto lontano dai
           fianchi tondi, dove lo spazio utile si stringe. */
        #pomodoro-cerchio {
            position: relative;
            width: var(--diametro-cerchio);
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--carta);
            border: 1px solid var(--bordo);
            box-shadow: 0 4px 18px rgba(80, 70, 30, .06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 0 14%;
        }

        /* Anello di avanzamento: corre appena dentro la circonferenza e a fine
           tempo ha percorso l'intero giro. È un cerchio SVG a cui si accorcia il
           tratteggio — dasharray lungo quanto tutta la circonferenza, e
           dashoffset che scende da "tutto nascosto" a zero. La rotazione di -90°
           sposta la partenza da ore 3 a ore 12. */
        #pomodoro-anello {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            --colore-barra: #8a9a5b;   /* lavoro — verde dei fili d'erba */
        }

        #pomodoro-anello.pausa {
            --colore-barra: #f5b400;   /* pausa — giallo dei brillantini */
        }

        #pomodoro-anello circle {
            fill: none;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        #pomodoro-anello .traccia {
            stroke: rgba(255, 255, 255, .6);   /* appena percettibile, come su Covatta */
        }

        #pomodoro-anello .avanzamento {
            stroke: var(--colore-barra);
            transition: stroke-dashoffset .25s linear, stroke .3s ease;
        }

        /* Particelle: strato in sovrimpressione, trasparente ai click.
           Il border-radius le ritaglia lungo il cerchio invece che lungo un
           rettangolo, così nessuna spunta dagli angoli che qui non esistono. */
        #pomodoro-neve {
            position: absolute;
            inset: 0;
            z-index: 3;
            overflow: hidden;
            border-radius: 50%;
            pointer-events: none;
        }

        .brillantino {
            position: absolute;
            top: -12px;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            opacity: 0;
            animation: nevicata linear forwards;
        }

        @keyframes nevicata {
            0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            15%  { opacity: .95; }
            80%  { opacity: .95; }
            100% { transform: translate(var(--deriva), var(--caduta)) rotate(var(--giro)); opacity: 0; }
        }

        /* Fili d'erba portati dal vento — modalità lavoro.
           Entrano da sinistra, attraversano, escono a destra. La curva è un arco
           di ellisse ottenuto per sottrazione: la scatola non ha sfondo e porta
           un solo bordo, o quello sopra o quello sotto, così con border-radius:50%
           ne resta visibile una metà soltanto. L'altezza della scatola non è
           quindi lo spessore del filo — quello è la larghezza del bordo — ma la
           profondità della curva. Il content-box è quello che rende la curva
           possibile: col border-box un bordo più spesso dell'altezza se la
           mangerebbe, riducendo il filo a un segmento dritto. */
        .fuscello {
            position: absolute;
            left: -30px;
            box-sizing: content-box;
            background: none;
            border-style: solid;
            border-color: transparent;
            border-radius: 50%;
            opacity: 0;
            animation: ventata linear forwards;
        }

        @keyframes ventata {
            0%   { transform: translate(0, 0) rotate(var(--inclinazione)); opacity: 0; }
            12%  { opacity: .8; }
            /* a metà corsa il filo sale o scende: è questo che dà l'aria di raffica */
            50%  { transform: translate(calc(var(--corsa) * .5), var(--onda))
                              rotate(calc(var(--inclinazione) + 18deg)); }
            82%  { opacity: .8; }
            100% { transform: translate(var(--corsa), 0)
                              rotate(calc(var(--inclinazione) + var(--giro))); opacity: 0; }
        }

        /* Chi ha chiesto meno animazioni al sistema non si ritrova i coriandoli */
        @media (prefers-reduced-motion: reduce) {
            #pomodoro-neve { display: none; }
        }

        #pomodoro-modi, #pomodoro-comandi {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .bottone-pomodoro {
            padding: 7px 16px;
            border-radius: 15px;
            border: 1px solid var(--bordo);
            background: var(--crema);
            color: var(--inchiostro);
            font-family: inherit;
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s ease, color .15s ease, border-color .15s ease;
        }

        .bottone-pomodoro:hover {
            border-color: var(--oro);
        }

        .bottone-pomodoro.attivo {
            background: var(--oro);
            border-color: var(--oro);
            color: #fff;
        }

        #pomodoro-display {
            font-family: 'Helvetica Neue', serif;
            font-size: 3rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: .02em;
            font-variant-numeric: tabular-nums;
        }

        #pomodoro-display.finito {
            color: var(--oro);
            animation: pulsazione 1.1s ease-in-out infinite;
        }

        @keyframes pulsazione {
            0%, 100% { opacity: 1; }
            50% { opacity: .35; }
        }

        /* "modifica" vive fuori dal cerchio, sopra: piccolo e scolorito sul nero,
           senza cornice. È anche fuori dal flusso, appeso al bordo superiore del
           blocco, così non entra nel calcolo dell'altezza e non sposta il cerchio
           dal centro: gli è solo ancorato sopra. Resta comunque il riferimento di
           posizione del popup, che si apre verso l'alto — verso il basso
           finirebbe addosso alla circonferenza. */
        #pomodoro-testata {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 14px;   /* lo stacco dal cerchio, senza produrre altezza */
            display: flex;
            justify-content: center;
        }

        #pomodoro-modifica {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-family: inherit;
            font-size: .72rem;
            letter-spacing: .04em;
            color: rgba(255, 255, 255, .28);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color .2s ease;
        }

        #pomodoro-modifica:hover {
            color: rgba(255, 255, 255, .6);
        }

        #pomodoro-popup {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 14px 16px;
            background: var(--carta);
            border: 1px solid var(--bordo);
            border-radius: 12px;
            box-shadow: 0 8px 26px rgba(80, 70, 30, .18);
            font-size: .8rem;
            color: #6b6650;
        }

        #pomodoro-popup.aperto {
            display: flex;
        }

        #pomodoro-popup label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        #pomodoro-popup input {
            width: 58px;
            padding: 4px 6px;
            border: 1px solid var(--bordo);
            border-radius: 8px;
            background: var(--crema);
            color: var(--inchiostro);
            font-family: inherit;
            font-size: .82rem;
            text-align: center;
        }

        #pomodoro-popup input:focus {
            outline: none;
            border-color: var(--oro);
        }

        /* ==== Pescibanco ===================================================
           Un cerchio della stessa misura del timer, con dentro il video. Il
           video è muto per costruzione (non ha proprio la traccia audio): la
           canzone è un <audio> a parte, che gira per conto suo. */
        /* Niente overflow:hidden qui: il ritaglio del genitore su un video non è
           una promessa che i browser mantengano — vedi il commento dell'anello
           qui sotto — e per giunta taglierebbe via proprio l'anello, che sporge.
           A tenere il video dentro il tondo pensano #pesci-video e #pesci-anello. */
        #pesci-cerchio {
            position: relative;
            width: var(--diametro-cerchio);
            aspect-ratio: 1;
            border-radius: 50%;
            background: #000;   /* il tondo c'è già mentre il video si carica */
            cursor: pointer;
            /* il tap accende la musica: niente rettangolo grigio addosso */
            -webkit-tap-highlight-color: transparent;
        }

        /* Il video è quadrato quanto il cerchio, ma il cover regge anche un
           domani in cui non lo fosse. Il ritaglio è chiesto due volte, con due
           proprietà diverse: il border-radius vale per chi disegna il video
           insieme al resto della pagina, il clip-path per chi invece lo manda su
           un piano suo — ed è il secondo caso quello che conta, perché lì il
           border-radius (proprio come l'overflow del genitore) viene ignorato. */
        #pesci-video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            -webkit-clip-path: circle(50%);
            clip-path: circle(50%);
        }

        /* Terza rete, e questa non dipende dalla buona volontà di nessuno:
           un anello di nero pieno, disegnato sopra il video, che copre i quattro
           angoli che sporgono dal tondo. Funziona perché il fondo della pagina è
           nero: l'anello non "ritaglia", ricopre. L'ombra parte dal bordo del
           cerchio e si allarga di un quarto del diametro — agli angoli, che
           distano un 0,207 di diametro, arriva con margine. */
        #pesci-anello {
            position: absolute;
            inset: 0;
            z-index: 2;
            border-radius: 50%;
            box-shadow: 0 0 0 calc(var(--diametro-cerchio) * .25) #000;
            pointer-events: none;
        }

        /* L'<audio> non ha controlli e non deve occupare spazio nel flex */
        #pesci-audio {
            display: none;
        }

        /* Spia dell'audio: compare al tocco e sfuma da sola. Serve solo a dire
           che il tap è stato registrato — a video muto non ci sarebbe nessun
           altro segnale. */
        #pesci-spia {
            position: absolute;
            z-index: 3;   /* sopra il video anche quando il video vola alto */
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(.82);
            font-size: 2.6rem;
            line-height: 1;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .6);
            transition: opacity .45s ease, transform .45s ease;
        }

        #pesci-spia.lampo {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
    <div id="mainContainer">
        <!-- Pagina 1: Meteo e Treni -->
        <div class="page screen-1" id="page1">
            <div class="blogpost">
                <!-- Radar precipitazioni -->
                <div class="meteo-container">
                    <div style="margin-bottom: 10px;">
                        <button class="toggle-btn radar" onclick="protezionecivile()">🌧️</button>
                    </div>

                    <!-- Bottoni meteo -->
                    <div class="buttons-container" style="position: relative;">
                        <button class="toggle-btn" onclick="toggleWidget('firenze')">
                            <span>FI</span>
                        </button>
                        <button class="toggle-btn" onclick="toggleWidget('pisa')">
                            <span>PI</span>
                        </button>
                        <button class="toggle-btn" onclick="mostraFumetto()">
                            <span>LI</span>
                        </button>
                        <div id="fumetto" class="fumetto">boia de</div>
                    </div>

                    <!-- Widget meteo -->
                    <div id="widgetPisa" style="margin-top:20px;" class="widget-wrapper">
                        <iframe loading="lazy" src="https://www.3bmeteo.com/moduli_esterni/localita_7_giorni_orario/5282/ffffff/1a5fb4/241f31/ffffff/it" width="382" height="497" frameborder="0"></iframe>
                    </div>
                    <div id="widgetFirenze" class="widget-wrapper">
                        <iframe loading="lazy" src="https://www.3bmeteo.com/moduli_esterni/localita_7_giorni_orario/2798/ffffff/1a5fb4/241f31/ffffff/it" width="382" height="497" frameborder="0"></iframe>
                    </div>

                    <!-- Sezione Treni -->
                    <div class="train-section">
                        <div class="train-row">
                            <button class="toggle-btn train-btn" onclick="apriStazione('S06513', 'SIGNA')">
                                <span>Signa</span>
                            </button>
                            <button class="toggle-btn train-btn" onclick="apriStazione('S06001', 'LASTRA A SIGNA')">
                                <span>Lastra a Signa</span>
                            </button>
                        </div>
                        <div class="train-row">
                            <button class="toggle-btn train-btn" onclick="apriStazione('S06500', 'PISA CENTRALE')">
                                <span>Pisa Centrale</span>
                            </button>
                            <button class="toggle-btn train-btn" onclick="apriStazione('S06421', 'FIRENZE S.M.NOVELLA')">
                                <span>Firenze SMN</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagina 2: Timer pomodoro -->
        <div class="page screen-2" id="page2">
            <div id="pomodoro-blocco">
                <!-- Durate modificabili al volo: valgono solo per questa sessione,
                     al ricaricamento tornano ai valori di DURATE nello script. -->
                <div id="pomodoro-testata">
                    <button type="button" id="pomodoro-modifica">modifica</button>
                    <div id="pomodoro-popup">
                        <label>lavoro <input type="number" id="durata-lavoro" min="1" max="180" step="1"> min</label>
                        <label>pausa <input type="number" id="durata-pausa" min="1" max="180" step="1"> min</label>
                    </div>
                </div>

                <div id="pomodoro-cerchio">
                    <!-- Il raggio scritto qui è l'unica fonte: il JS ne ricava la
                         circonferenza per il tratteggio, quindi per spostare
                         l'anello basta cambiare r (e lo stesso r sulla traccia). -->
                    <svg id="pomodoro-anello" viewBox="0 0 100 100" aria-hidden="true">
                        <circle class="traccia" cx="50" cy="50" r="48.5" stroke-width="1.9"></circle>
                        <circle class="avanzamento" cx="50" cy="50" r="48.5" stroke-width="1.9"></circle>
                    </svg>
                    <div id="pomodoro-neve" aria-hidden="true"></div>

                    <div id="pomodoro-modi">
                        <button type="button" class="bottone-pomodoro attivo" data-modo="lavoro">Lavoro 50</button>
                        <button type="button" class="bottone-pomodoro" data-modo="pausa">Pausa 10</button>
                    </div>
                    <div id="pomodoro-display">50:00</div>
                    <div id="pomodoro-comandi">
                        <button type="button" class="bottone-pomodoro" id="pomodoro-avvia">Avvia</button>
                        <button type="button" class="bottone-pomodoro" id="pomodoro-azzera">Azzera</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagina 3: Pescibanco -->
        <div class="page screen-3" id="page3">
            <div id="pesci-cerchio">
                <!-- muted e playsinline non sono decorazioni: senza, la partenza
                     automatica non è consentita e su iOS il video andrebbe a
                     schermo intero. Il preload è metadata soltanto — il file
                     pesa, e non ha senso scaricarlo a chi non arriva quaggiù. -->
                <video id="pesci-video" src="pescibanco.mp4"
                       muted loop playsinline preload="metadata"
                       disablepictureinpicture></video>
                <div id="pesci-anello" aria-hidden="true"></div>
                <div id="pesci-spia" aria-hidden="true">🔇</div>
            </div>
            <audio id="pesci-audio" src="bancopesci.mp3" loop preload="none"></audio>
        </div>

        <!-- Pagina 4: Placeholder -->
        <div class="page screen-4" id="page4">
            <div class="blogpost">
                <div class="screen-two-content">
                    <h2>Schermata 2</h2>
                    <p>Qui ci metti quello che vuoi</p>
                    <div class="buttons-container" style="margin-top: 30px;">
                        <button class="toggle-btn">
                            <span>A</span>
                        </button>
                        <button class="toggle-btn">
                            <span>B</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Registra Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .catch(err => console.log('SW registration failed:', err));
        }

        // Impaginazione verticale. Le pagine stanno in fila una sotto l'altra:
        // quella in vista è a 0, la precedente a -100%, la successiva a +100%.
        // Tutto si ricava dalla distanza dall'indice corrente, così una quarta
        // schermata, domani, sarà un <div> in più e una riga in più qui sotto.
        const pagine = [
            document.getElementById('page1'),
            document.getElementById('page2'),
            document.getElementById('page3'),
            document.getElementById('page4')
        ];
        const container = document.getElementById('mainContainer');

        let indicePagina = 0;
        let startY = 0;
        let isDragging = false;
        // Vero se il dito ha viaggiato: distingue lo sfoglio dal tap sul video
        let ditoMosso = false;
        const SWIPE_THRESHOLD = 80;
        const RESISTANCE_FACTOR = 0.4;

        // scostamento: il trascinamento in corso, in px. A riposo vale 0.
        function posiziona(scostamento = 0) {
            const quota = scostamento / window.innerHeight;   // in unità di schermo
            pagine.forEach((pagina, i) => {
                const distanza = (i - indicePagina) + quota;  // 0 = perfettamente in vista
                pagina.style.transform = `translateY(${distanza * 100}%)`;
                pagina.style.opacity = Math.max(0, 1 - Math.abs(distanza));
                // Le pagine fuori vista sono trasparenti ma resterebbero cliccabili:
                // senza questa riga si premerebbero al buio i bottoni del meteo.
                pagina.style.pointerEvents = i === indicePagina ? 'auto' : 'none';
            });
        }

        // Durante il trascinamento le pagine devono seguire il dito senza
        // interpolazione, altrimenti arrivano in ritardo di 0,4s.
        function conAnimazione(attiva) {
            pagine.forEach(p => { p.style.transition = attiva ? '' : 'none'; });
        }

        function vaiA(nuovoIndice) {
            indicePagina = nuovoIndice;
            aggiornaPescibanco();   // il video vive solo mentre la sua pagina è in vista
            // 'exiting' accorcia la dissolvenza di chi esce: senza, la pagina
            // vecchia resta visibile troppo a lungo sopra quella nuova.
            pagine.forEach(p => p.classList.add('exiting'));
            conAnimazione(true);
            posiziona();
            setTimeout(() => pagine.forEach(p => p.classList.remove('exiting')), 400);
        }

        // Touch events
        container.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
            ditoMosso = false;
        });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;

            const deltaY = e.touches[0].clientY - startY;

            if (Math.abs(deltaY) > 10) { e.preventDefault(); ditoMosso = true; }

            // Ai due capi della fila non c'è niente da scoprire: il trascinamento
            // non risponde, invece di mostrare il vuoto oltre l'ultima pagina.
            const primaInAlto = indicePagina === 0 && deltaY > 0;
            const ultimaInBasso = indicePagina === pagine.length - 1 && deltaY < 0;
            if (primaInAlto || ultimaInBasso) return;

            conAnimazione(false);
            posiziona(deltaY * RESISTANCE_FACTOR);
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;

            const deltaY = e.changedTouches[0].clientY - startY;
            conAnimazione(true);

            if (deltaY < -SWIPE_THRESHOLD && indicePagina < pagine.length - 1) {
                vaiA(indicePagina + 1);
            } else if (deltaY > SWIPE_THRESHOLD && indicePagina > 0) {
                vaiA(indicePagina - 1);
            } else {
                posiziona();
            }
        });

        // Wheel events
        let wheelTimeout;
        container.addEventListener('wheel', (e) => {
            e.preventDefault();

            clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
                if (e.deltaY > 50 && indicePagina < pagine.length - 1) {
                    vaiA(indicePagina + 1);
                } else if (e.deltaY < -50 && indicePagina > 0) {
                    vaiA(indicePagina - 1);
                }
            }, 50);
        }, { passive: false });

        posiziona();

        // ==== Pescibanco ================================================
        // Terza schermata: il video gira da solo finché la pagina è in vista,
        // la canzone la si accende col dito. Sono due riproduzioni separate,
        // ciascuna in loop per conto proprio: non vanno d'accordo e non devono.
        const PAGINA_PESCI = 2;
        const cerchioPesci = document.getElementById('pesci-cerchio');
        const videoPesci = document.getElementById('pesci-video');
        const audioPesci = document.getElementById('pesci-audio');
        const spiaPesci = document.getElementById('pesci-spia');
        let timerSpia = null;
        let guardiaVideo = null;

        function mostraSpia(simbolo) {
            spiaPesci.textContent = simbolo;
            spiaPesci.classList.add('lampo');
            clearTimeout(timerSpia);
            timerSpia = setTimeout(() => spiaPesci.classList.remove('lampo'), 750);
        }

        // Entrando: il video riparte da dove l'avevi lasciato — è un giro
        // continuo, il punto d'attacco non conta. Uscendo: tutto in pausa, e la
        // canzone torna a capo, così ogni visita la riprende dall'inizio e
        // dall'inizio va riaccesa col dito.
        function aggiornaPescibanco() {
            clearInterval(guardiaVideo);
            guardiaVideo = null;

            if (indicePagina === PAGINA_PESCI) {
                // È muto: la partenza automatica non ha bisogno di permessi
                videoPesci.play().catch(() => {});
                ultimoIstante = -1;   // la guardia riparte senza memoria di prima
                guardiaVideo = setInterval(ricominciaVideo, 1000);
                // La canzone si scarica appena si arriva qui, non al tocco:
                // altrimenti fra il dito e il primo suono ci sarebbe l'attesa
                // del download. Da lì in poi è già pronta in memoria.
                if (audioPesci.preload === 'none') {
                    audioPesci.preload = 'auto';
                    audioPesci.load();
                }
            } else {
                videoPesci.pause();
                audioPesci.pause();
                audioPesci.currentTime = 0;
                spiaPesci.classList.remove('lampo');
            }
        }

        // L'attributo loop resta la via maestra, ma non è affidabile ovunque:
        // Firefox, arrivato in fondo, a volte si ferma invece di ricominciare —
        // capita con i file che portano una edit list, com'è questo. Sotto ci
        // sono quindi due reti, e quando loop fa il suo dovere non serve né
        // l'una né l'altra: a giro riuscito 'ended' non scatta nemmeno.
        //   1. 'ended' — riparte sul momento, se la fine viene dichiarata;
        //   2. una guardia al secondo — per quando invece resta fermo in fondo
        //      senza dire niente. Va solo mentre la pagina è in vista, e guarda
        //      il solo video: la canzone in pausa è una scelta di chi guarda,
        //      non un inceppo da rimediare.
        let ultimoIstante = -1;

        function ricominciaVideo() {
            if (indicePagina !== PAGINA_PESCI) return;

            const istante = videoPesci.currentTime;
            const durata = videoPesci.duration;
            // "Bloccato" è il caso muto: siamo a un soffio dalla fine e il tempo
            // non avanza più da un controllo all'altro, ma nessuno ha dichiarato
            // niente. Il vincolo sulla fine tiene fuori le pause di caricamento
            // a metà filmato, che non sono affar nostro.
            const inFondo = Number.isFinite(durata) && istante >= durata - 0.4;
            const bloccato = inFondo && istante === ultimoIstante;
            ultimoIstante = istante;

            if (!videoPesci.paused && !bloccato) return;
            if (bloccato || videoPesci.ended) videoPesci.currentTime = 0;
            videoPesci.play().catch(() => {});
        }

        videoPesci.addEventListener('ended', ricominciaVideo);

        audioPesci.addEventListener('ended', () => {
            if (indicePagina !== PAGINA_PESCI) return;
            audioPesci.currentTime = 0;
            audioPesci.play().catch(() => {});
        });

        // Il tap accende e spegne la canzone, quante volte si vuole. Se il dito
        // ha viaggiato non era un tap ma uno sfoglio: il click sintetico che
        // qualche browser manda lo stesso va ignorato.
        cerchioPesci.addEventListener('click', () => {
            if (ditoMosso) return;
            if (audioPesci.paused) {
                audioPesci.play().catch(() => {});
                mostraSpia('🔊');
            } else {
                audioPesci.pause();
                mostraSpia('🔇');
            }
        });

        aggiornaPescibanco();

        function toggleWidget(city) {
            const pisaWidget = document.getElementById('widgetPisa');
            const firenzeWidget = document.getElementById('widgetFirenze');
            const buttons = document.querySelectorAll('#page1 .buttons-container > .toggle-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (city === 'pisa') {
                pisaWidget.classList.toggle('show');
                firenzeWidget.classList.remove('show');
                if (pisaWidget.classList.contains('show')) buttons[1].classList.add('active');
            } else if (city === 'firenze') {
                firenzeWidget.classList.toggle('show');
                pisaWidget.classList.remove('show');
                if (firenzeWidget.classList.contains('show')) buttons[0].classList.add('active');
            }
        }

        function apriStazione(codiceStazione, nomeStazione) {
            window.location.href = `http://www.viaggiatreno.it/infomobilitamobile/pages/cercaTreno/cercaTreno.jsp?cod=${codiceStazione}&nome=${encodeURIComponent(nomeStazione)}`;
        }

        function protezionecivile() {
            window.location.href = `https://radar.protezionecivile.it/`;
        }

        function mostraFumetto() {
            const fumetto = document.getElementById('fumetto');
            fumetto.classList.add('show');
            setTimeout(() => fumetto.classList.remove('show'), 15000);
        }

        // ==== Timer pomodoro ============================================
        // Portato da Covatta senza modifiche di comportamento. L'unica parte
        // riscritta è il disegno dell'avanzamento, che qui è un anello.
        const DURATE = { lavoro: 50 * 60, pausa: 10 * 60 };
        const display = document.getElementById("pomodoro-display");
        const bottoneAvvia = document.getElementById("pomodoro-avvia");
        const bottoneAzzera = document.getElementById("pomodoro-azzera");
        const bottoniModo = document.querySelectorAll("#pomodoro-modi .bottone-pomodoro");

        let modo = "lavoro";
        let rimanenti = DURATE[modo];
        let fine = null;          // timestamp di fine mentre gira, null da fermo
        let tickTimer = null;

        function formattaTempo(secondi) {
            secondi = Math.max(0, secondi);
            const m = Math.floor(secondi / 60), s = secondi % 60;
            return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }

        const anello = document.getElementById("pomodoro-anello");
        const avanzamento = anello.querySelector(".avanzamento");
        // La circonferenza si ricava dal raggio scritto nel markup, così anello e
        // tratteggio non possono andare fuori sincrono se un giorno sposti l'uno.
        const CIRCONFERENZA = 2 * Math.PI * avanzamento.r.baseVal.value;
        avanzamento.style.strokeDasharray = CIRCONFERENZA;

        function disegnaTimer() {
            display.textContent = formattaTempo(rimanenti);
            document.title = fine ? formattaTempo(rimanenti) + " · Coffee" : "Coffee";

            // Quota di tempo già trascorso: 0 all'avvio, 1 allo scadere. Il tratto
            // disegnato è tutta la circonferenza, ed è l'offset a nasconderne la
            // parte non ancora percorsa: a 0 l'anello sparisce, a 1 chiude il giro.
            const totale = DURATE[modo];
            const trascorso = totale > 0 ? (totale - Math.max(0, rimanenti)) / totale : 0;
            avanzamento.style.strokeDashoffset = (CIRCONFERENZA * (1 - trascorso)).toFixed(2);
            anello.classList.toggle("pausa", modo === "pausa");
        }

        // Due rintocchi della stessa nota, sfalsati: la coda del primo suona ancora
        // quando parte il secondo, come una campana battuta due volte.
        const NOTA_CAMPANELLA = 660;   // Hz
        const DISTANZA_RINTOCCHI = .55;  // secondi tra un rintocco e l'altro
        const VOLUME_CAMPANELLA = .24;

        function suonaCampanella() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();

                function rintocco(ritardo) {
                    const inizio = ctx.currentTime + ritardo;
                    const osc = ctx.createOscillator(), volume = ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.value = NOTA_CAMPANELLA;
                    osc.connect(volume);
                    volume.connect(ctx.destination);
                    // La rampa esponenziale non può partire da zero: si parte da un filo
                    volume.gain.setValueAtTime(0.0001, inizio);
                    volume.gain.exponentialRampToValueAtTime(VOLUME_CAMPANELLA, inizio + 0.02);
                    volume.gain.exponentialRampToValueAtTime(0.0001, inizio + 1.3);
                    osc.start(inizio);
                    osc.stop(inizio + 1.35);
                }

                rintocco(0);
                rintocco(DISTANZA_RINTOCCHI);
            } catch (e) { /* audio non disponibile: pazienza, resta il lampeggio */ }
        }

        // ---- Brillantini ---------------------------------------------------
        // Metti a false per spegnere tutto senza toccare altro.
        const BRILLANTINI = true;
        const COLORI_BRILLANTINI = ["#f5b400", "#a89968", "#ffffff", "#e8483f", "#0a66c2"];
        const neve = document.getElementById("pomodoro-neve");
        let generatoreNeve = null;

        function creaBrillantino(fretta = 1) {
            const s = document.createElement("span");
            s.className = "brillantino";
            const lato = 3 + Math.random() * 6;
            s.style.width = lato + "px";
            s.style.height = lato + "px";
            s.style.left = (Math.random() * 100) + "%";
            s.style.background = COLORI_BRILLANTINI[Math.floor(Math.random() * COLORI_BRILLANTINI.length)];
            s.style.setProperty("--deriva", Math.round(Math.random() * 60 - 30) + "px");
            s.style.setProperty("--caduta", (neve.offsetHeight + 24) + "px");
            s.style.setProperty("--giro", Math.round(Math.random() * 900 - 450) + "deg");
            s.style.animationDuration = ((2.6 + Math.random() * 2.6) / fretta).toFixed(2) + "s";
            // Ogni brillantino si rimuove da solo: niente accumulo nel DOM
            s.addEventListener("animationend", () => s.remove());
            neve.appendChild(s);
        }

        // Vento: fili d'erba e semi che attraversano da sinistra a destra
        const COLORI_ERBA = ["#8a9a5b", "#a89968", "#b9c489", "#6d7d4b", "#d9c98d"];

        // Quanto pende il filo, in px di profondità della curva. Alzando il minimo
        // si curvano tutti di più; portando il minimo a 0 tornano dei segmenti dritti.
        const CURVATURA_MIN = 2;
        const CURVATURA_MAX = 9;

        // Lunghezza del filo e durata della traversata, che sono legate: i fili
        // lunghi attraversano più in fretta, i corti indugiano. La durata non è
        // sorteggiata a sé — si ricava interpolando fra i due estremi, così il caso
        // interviene una volta sola, sulla lunghezza, e la velocità ne discende.
        const LUNGHEZZA_MIN = 20;
        const LUNGHEZZA_MAX = 80;
        const DURATA_CORTO = 6;    // secondi — il filo più corto, il più lento
        const DURATA_LUNGO = 3;    // secondi — il filo più lungo, il più veloce

        function creaFuscello(fretta = 1) {
            const s = document.createElement("span");
            s.className = "fuscello";
            const spessore = 1.5 + Math.random() * 2;
            const curvatura = CURVATURA_MIN + Math.random() * (CURVATURA_MAX - CURVATURA_MIN);
            const lunghezza = LUNGHEZZA_MIN + Math.random() * (LUNGHEZZA_MAX - LUNGHEZZA_MIN);
            const quota = (lunghezza - LUNGHEZZA_MIN) / (LUNGHEZZA_MAX - LUNGHEZZA_MIN);  // 0 corto, 1 lungo
            const durata = DURATA_CORTO + quota * (DURATA_LUNGO - DURATA_CORTO);
            s.style.width = lunghezza + "px";                     // lunghezza del filo
            s.style.height = curvatura + "px";                    // profondità della curva
            // Un solo bordo acceso: sotto il filo pende in giù, sopra pende in su.
            // Metà e metà, così la ventata non piega tutti i fili dallo stesso lato.
            s.style.borderWidth = Math.random() < .5
                ? "0 0 " + spessore + "px"
                : spessore + "px 0 0";
            s.style.top = (Math.random() * 100) + "%";
            s.style.borderColor = COLORI_ERBA[Math.floor(Math.random() * COLORI_ERBA.length)];
            s.style.setProperty("--corsa", (neve.offsetWidth + 60) + "px");
            // Modulo e verso separati: l'ampiezza resta sempre sensibile (20-60px),
            // ma metà dei fili sale e metà scende. Con un solo intervallo non si può
            // avere entrambe le cose: o attraversa lo zero, o pende da un lato solo.
            const ampiezzaOnda = 20 + Math.random() * 40;
            const versoOnda = Math.random() < .5 ? -1 : 1;
            s.style.setProperty("--onda", Math.round(ampiezzaOnda * versoOnda) + "px");
            s.style.setProperty("--inclinazione", Math.round(Math.random() * 44 - 90) + "deg");
            s.style.setProperty("--giro", Math.round(Math.random() * 220 - 140) + "deg");
            s.style.animationDuration = (durata / fretta).toFixed(2) + "s";
            s.addEventListener("animationend", () => s.remove());
            neve.appendChild(s);
        }

        // Ogni modalità ha la sua particella e il suo ritmo
        const INTERVALLO_NEVE = 50;   // pausa — brillantini
        const INTERVALLO_ERBA = 40;   // lavoro — fili d'erba

        function creaParticella(fretta) {
            if (modo === "lavoro") creaFuscello(fretta);
            else creaBrillantino(fretta);
        }

        function avviaEffetto() {
            if (!BRILLANTINI || generatoreNeve) return;
            const passo = modo === "lavoro" ? INTERVALLO_ERBA : INTERVALLO_NEVE;
            generatoreNeve = setInterval(() => creaParticella(), passo);
        }

        function fermaEffetto() {
            clearInterval(generatoreNeve);
            generatoreNeve = null;
        }

        // Scroscio finale: più fitto e più veloce, con la particella della modalità
        // che si è appena conclusa. Poi si esaurisce da solo.
        function scrosciaFinale() {
            if (!BRILLANTINI) return;
            for (let i = 0; i < 90; i++) setTimeout(() => creaParticella(1.7), i * 20);
        }
        // ---------------------------------------------------------------------

        function fermaTimer() {
            clearInterval(tickTimer);
            tickTimer = null;
            fine = null;
            bottoneAvvia.textContent = "Avvia";
            fermaEffetto();
            salvaStato();
        }

        // Si conta sul timestamp di fine, non decrementando: così resta esatto
        // anche quando il browser rallenta la scheda in secondo piano.
        // Selezione della modalità: un posto solo, usato sia dai bottoni sia dal
        // ribaltamento automatico di fine tempo.
        function selezionaModo(nuovo) {
            modo = nuovo;
            bottoniModo.forEach(b => b.classList.toggle("attivo", b.dataset.modo === nuovo));
            rimanenti = DURATE[modo];
            disegnaTimer();
            salvaStato();
        }

        // A fine tempo la modalità si ribalta da sola: finito il lavoro trovi la
        // pausa già pronta, basta premere Avvia. Il cambio arriva con un ritardo
        // pari allo scroscio, così prima vedi lo zero e senti la campanella.
        const RITARDO_RIBALTAMENTO = 1800;

        function ribaltaModalita() {
            // Se nel frattempo hai già agito — avviato, azzerato, cambiato modalità —
            // l'automatismo si fa da parte e non ti sovrascrive la scelta.
            if (fine || rimanenti > 0) return;
            display.classList.remove("finito");
            selezionaModo(modo === "lavoro" ? "pausa" : "lavoro");
        }

        function battito() {
            rimanenti = Math.round((fine - Date.now()) / 1000);
            if (rimanenti <= 0) {
                rimanenti = 0;
                fermaTimer();
                display.classList.add("finito");
                suonaCampanella();
                scrosciaFinale();
                setTimeout(ribaltaModalita, RITARDO_RIBALTAMENTO);
            }
            disegnaTimer();
        }

        bottoneAvvia.addEventListener("click", () => {
            if (fine) { fermaTimer(); disegnaTimer(); return; }
            display.classList.remove("finito");
            if (rimanenti <= 0) rimanenti = DURATE[modo];
            fine = Date.now() + rimanenti * 1000;
            tickTimer = setInterval(battito, 250);
            bottoneAvvia.textContent = "Pausa";
            avviaEffetto();
            disegnaTimer();
            salvaStato();
        });

        bottoneAzzera.addEventListener("click", () => {
            fermaTimer();
            display.classList.remove("finito");
            rimanenti = DURATE[modo];
            disegnaTimer();
            salvaStato();
        });

        bottoniModo.forEach(bottone => {
            bottone.addEventListener("click", () => {
                fermaTimer();
                display.classList.remove("finito");
                selezionaModo(bottone.dataset.modo);
            });
        });

        // Durate modificabili dal browser — solo per la sessione in corso.
        // I valori di partenza vengono letti da DURATE, che resta l'unica fonte:
        // per cambiare lo standard basta modificare quella riga.
        const inputLavoro = document.getElementById("durata-lavoro");
        const inputPausa = document.getElementById("durata-pausa");

        function aggiornaEtichetteModi() {
            bottoniModo.forEach(bottone => {
                const quale = bottone.dataset.modo;
                const minuti = Math.round(DURATE[quale] / 60);
                bottone.textContent = (quale === "lavoro" ? "Lavoro " : "Pausa ") + minuti;
            });
        }

        function applicaDurata(input, quale) {
            let minuti = parseInt(input.value, 10);
            if (!Number.isFinite(minuti)) minuti = Math.round(DURATE[quale] / 60);
            minuti = Math.min(180, Math.max(1, minuti));
            input.value = minuti;
            DURATE[quale] = minuti * 60;
            aggiornaEtichetteModi();
            // Se stai ritoccando la modalità in corso, il timer riparte pulito sulla nuova durata
            if (quale === modo) {
                fermaTimer();
                display.classList.remove("finito");
                rimanenti = DURATE[modo];
            }
            disegnaTimer();
            salvaStato();
        }

        inputLavoro.addEventListener("change", () => applicaDurata(inputLavoro, "lavoro"));
        inputPausa.addEventListener("change", () => applicaDurata(inputPausa, "pausa"));

        // ---- Ripresa dopo la chiusura ---------------------------------------
        // Android e iOS scaricano le PWA dalla memoria quando serve spazio, e al
        // ritorno la pagina si ricarica da zero. Lo stato viene quindi depositato
        // su localStorage a ogni transizione, così un pomodoro che stava girando
        // riprende da dov'era invece di ripartire dall'inizio. Basta il timestamp
        // di fine: essendo assoluto, non importa quanto la pagina sia stata morta.
        const CHIAVE_POMODORO = "coffee-pomodoro";
        const SCADENZA_STATO = 12 * 60 * 60 * 1000;   // oltre, è roba vecchia da ignorare

        function salvaStato() {
            const stato = {
                quando: Date.now(),
                modo: modo,
                fine: fine,
                rimanenti: rimanenti,
                // Le durate ritoccate da "modifica" restano volatili come prima —
                // un ricaricamento a timer fermo le riporta ai valori di DURATE —
                // ma qui vanno portate dietro lo stesso: senza, un lavoro da 25
                // minuti ripreso dopo un riavvio verrebbe ridisegnato su una
                // scala da 50, e l'anello indicherebbe un avanzamento falso.
                durate: { lavoro: DURATE.lavoro, pausa: DURATE.pausa }
            };
            try { localStorage.setItem(CHIAVE_POMODORO, JSON.stringify(stato)); }
            catch (e) { /* storage pieno o negato: si perde solo la ripresa */ }
        }

        function ripristinaStato() {
            let stato;
            try { stato = JSON.parse(localStorage.getItem(CHIAVE_POMODORO)); }
            catch (e) { return; }
            if (!stato || Date.now() - stato.quando > SCADENZA_STATO) return;

            if (stato.modo === "lavoro" || stato.modo === "pausa") modo = stato.modo;
            if (stato.durate && stato.durate.lavoro > 0 && stato.durate.pausa > 0) {
                DURATE.lavoro = stato.durate.lavoro;
                DURATE.pausa = stato.durate.pausa;
            }

            if (stato.fine && stato.fine > Date.now()) {
                // Stava girando ed è ancora in tempo: riprende senza chiedere nulla
                fine = stato.fine;
                rimanenti = Math.round((fine - Date.now()) / 1000);
                tickTimer = setInterval(battito, 250);
                bottoneAvvia.textContent = "Pausa";
                avviaEffetto();
            } else if (stato.fine) {
                // È scaduto mentre la pagina era morta. Lo zero lampeggiante si
                // vede, la campanella no: suonarla adesso sarebbe suonarla tardi.
                rimanenti = 0;
                display.classList.add("finito");
            } else {
                // Era fermo a metà strada: si ritrova dove l'avevi lasciato
                rimanenti = stato.rimanenti > 0 ? stato.rimanenti : DURATE[modo];
            }
        }

        ripristinaStato();   // prima di disegnare: può cambiare modo, durate e conteggio

        inputLavoro.value = Math.round(DURATE.lavoro / 60);
        inputPausa.value = Math.round(DURATE.pausa / 60);
        aggiornaEtichetteModi();
        // La modalità ripristinata va riflessa sui bottoni: qui non si passa da
        // selezionaModo, che azzererebbe il conteggio appena recuperato.
        bottoniModo.forEach(b => b.classList.toggle("attivo", b.dataset.modo === modo));
        disegnaTimer();

        // Popup delle durate: si apre da "modifica", si chiude ricliccando,
        // premendo Esc, o cliccando fuori
        const popupDurate = document.getElementById("pomodoro-popup");
        const bottoneModifica = document.getElementById("pomodoro-modifica");

        function chiudiPopup() {
            popupDurate.classList.remove("aperto");
        }

        bottoneModifica.addEventListener("click", evento => {
            evento.stopPropagation();
            popupDurate.classList.toggle("aperto");
            if (popupDurate.classList.contains("aperto")) inputLavoro.focus();
        });

        // I click dentro al popup non devono farlo richiudere
        popupDurate.addEventListener("click", evento => evento.stopPropagation());

        document.addEventListener("click", chiudiPopup);
        document.addEventListener("keydown", evento => {
            if (evento.key === "Escape") chiudiPopup();
            if (evento.key === "Enter" && popupDurate.contains(evento.target)) {
                evento.target.blur();   // conferma il valore, poi chiude
                chiudiPopup();
            }
        });
    </script>
</body>
</html>
