<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="coffee.json">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/ico.ico">
    <link rel="stylesheet" href="../css/ciessesse.css">
    <title>Coffee</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }

        #mainContainer {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .page {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1),
                        opacity 0.4s cubic-bezier(0.4, 0.0, 0.2, 1) 0.25s;
            overflow: hidden;
        }

        .page.exiting {
            transition: transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1),
                        opacity 0.15s cubic-bezier(0.4, 0.0, 0.2, 1) !important;
        }

        .page.screen-1 {
            transform: translateY(0);
            opacity: 1;
        }

        .page.screen-2 {
            transform: translateY(100%);
            opacity: 0;
        }

        .blogpost {
            max-width: 800px;
            text-align: center;
            padding: 10px;
        }

        .meteo-container {
            margin: 20px;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }

        .radar {
            font-size: 15px !important;
            height: 30px !important;
            border-radius: 50% !important;
            width: 30px !important;
        }

        .toggle-btn {
            background: linear-gradient(135deg, #1a5fb4 0%, #3584e4 100%);
            color: white;
            padding: 0;
            border: none;
            border-radius: 30%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 22px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(26, 95, 180, 0.3);
            position: relative;
            overflow: hidden;
        }

        .toggle-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 30%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        .toggle-btn:hover::before {
            width: 100%;
            height: 100%;
        }

        .toggle-btn:hover {
            box-shadow: 0 6px 20px rgba(26, 95, 180, 0.5);
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #3584e4 0%, #62a0ea 100%);
            box-shadow: 0 0 0 4px rgba(26, 95, 180, 0.2);
            transform: scale(1.05);
        }

        .toggle-btn span {
            position: relative;
            z-index: 1;
        }

        .train-btn {
            width: auto;
            height: 25px;
            padding: 0 10px;
            font-size: 15px;
            border-radius: 10px;
            background: linear-gradient(135deg, #c01c28 0%, #e01b24 100%);
        }

        .widget-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            display: flex;
            justify-content: center;
        }

        .widget-wrapper.show {
            max-height: 600px;
        }

        #conto {
            color: #fff;
            text-align: center;
            padding: 20px;
            /* I coriandoli riempiono tutta la schermata: senza questo, cifre
               e titolo finirebbero sotto la pioggia invece che davanti. */
            position: relative;
            z-index: 1;
        }

        #conto-titolo {
            font-family: 'Faustina', serif;
            font-weight: 400;
            font-size: clamp(1.4rem, 6vw, 2.2rem);
            margin: 0 0 24px;
        }

        #conto-cifre {
            display: flex;
            justify-content: center;
            gap: 22px;
        }

        .unita {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Le cifre cambiano ogni secondo: senza larghezza fissa per carattere
               la riga si allargherebbe e restringerebbe di continuo. */
            font-variant-numeric: tabular-nums;
        }

        .numero {
            font-family: 'Faustina', serif;
            font-size: clamp(2.6rem, 13vw, 5rem);
            line-height: 1.05;
        }

        .etichetta {
            font-size: clamp(0.65rem, 2.6vw, 0.8rem);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #888;
            margin-top: 6px;
        }

        #conto-finito {
            font-family: 'Faustina', serif;
            font-size: clamp(1.8rem, 8vw, 3rem);
            margin: 0;
        }

        @media (max-width: 420px) {
            #conto-cifre {
                gap: 12px;
            }
        }

        /* Invito a scoprire la seconda schermata. Vive in fondo alla prima e
           si spegne appena si scende, così non resta a insistere su una
           pagina già trovata. */
        #suggerimento {
            position: absolute;
            left: 50%;
            /* Installata, la pagina arriva fino in fondo allo schermo: senza
               la safe-area le frecce finiscono sotto la barra di sistema. */
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            /* È un invito, non un bottone: non deve intercettare i tap
               destinati a quello che gli sta sotto. */
            pointer-events: none;
            transition: opacity 0.3s ease;
            animation: tremolio 0.7s ease-in-out infinite;
        }

        #suggerimento.via {
            opacity: 0;
        }

        #suggerimento .scritta {
            font-family: 'Faustina', serif;
            font-size: 1rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        /* Ogni lettera balla per conto suo: il ritardo crescente, assegnato
           dallo script, fa correre l'onda da sinistra a destra invece di
           far saltare tutta la parola insieme. */
        #suggerimento .lettera,
        #conto-titolo .lettera {
            display: inline-block;
            animation: ballonzola 1s ease-in-out infinite;
        }

        .scintilla,
        #conto-titolo .emoji {
            display: inline-block;
            animation: giravolta 1.6s ease-in-out infinite;
        }

        .scintilla { margin: 0 6px; }
        #conto-titolo .emoji { margin: 0 10px; }
        #conto-titolo .emoji:last-child { animation-delay: 0.8s; }

        /* Il ventaglio: cinque frecce storte, ognuna che sbanda per conto suo.
           L'inclinazione di partenza sta in --storto, scritta sul posto in
           HTML; le animazioni la riprendono invece di azzerarla, altrimenti
           al primo fotogramma le frecce si raddrizzerebbero tutte. */
        .ventaglio {
            display: flex;
            align-items: center;
            gap: 1px;
        }

        .ventaglio svg {
            width: 26px;
            height: 12px;
            display: block;
            animation: sbanda 1.1s ease-in-out infinite,
                       colori 2.2s linear infinite;
        }

        .ventaglio svg:nth-child(1) { animation-delay: 0s,    0.0s; }
        .ventaglio svg:nth-child(2) { animation-delay: 0.09s, 0.3s; }
        .ventaglio svg:nth-child(3) { animation-delay: 0.18s, 0.6s; }
        .ventaglio svg:nth-child(4) { animation-delay: 0.27s, 0.9s; }
        .ventaglio svg:nth-child(5) { animation-delay: 0.36s, 1.2s; }

        /* Ogni freccia si ribalta attorno alla propria inclinazione: da -storto
           a +storto, rimpicciolendo e ingrandendo. Con --storto a zero resta
           la sola pulsazione, ed è la freccia dritta in mezzo al ventaglio. */
        @keyframes sbanda {
            0%, 100% {
                transform: rotate(var(--storto, 0deg)) translateY(-3px) scale(0.85);
                opacity: 0.25;
            }
            50% {
                transform: rotate(calc(var(--storto, 0deg) * -1)) translateY(5px) scale(1.15);
                opacity: 1;
            }
        }

        @keyframes ballonzola {
            0%, 100% { transform: translateY(0)    rotate(0deg); }
            30%      { transform: translateY(-7px) rotate(-9deg); }
            65%      { transform: translateY(3px)  rotate(7deg); }
        }

        @keyframes giravolta {
            0%, 100% { transform: rotate(-18deg) scale(1); }
            50%      { transform: rotate(18deg)  scale(1.35); }
        }

        /* Il giro completo dei colori. L'ultimo fotogramma torna al primo,
           o a ogni ripetizione si vedrebbe uno scatto dal verde al blu. */
        @keyframes colori {
            0%   { color: #3584e4; }
            14%  { color: #9141ac; }
            28%  { color: #ff00a0; }
            42%  { color: #e01b24; }
            57%  { color: #ff7800; }
            71%  { color: #f6d32d; }
            85%  { color: #33d17a; }
            100% { color: #3584e4; }
        }

        /* Il tremolio muove l'intero gruppo, che è già centrato da una
           translateX: va ripetuta in ogni fotogramma, o l'animazione la
           sostituirebbe e il suggerimento scivolerebbe a destra. */
        @keyframes tremolio {
            0%, 100% { transform: translateX(-50%)             rotate(0deg); }
            20%      { transform: translateX(calc(-50% - 3px)) rotate(-3deg); }
            40%      { transform: translateX(calc(-50% + 2px)) rotate(2.5deg); }
            60%      { transform: translateX(calc(-50% - 2px)) rotate(-2deg); }
            80%      { transform: translateX(calc(-50% + 3px)) rotate(3deg); }
        }

        /* I coriandoli cadono dietro al titolo, ciascuno con la sua deriva
           laterale, la sua durata e il suo ritardo, assegnati dallo script:
           è quello che impedisce loro di scendere in formazione. */
        #coriandoli {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Fermi finché la loro schermata non è in vista: non c'è ragione di
           far girare quaranta animazioni sotto la pagina del meteo. */
        #coriandoli.in-pausa .coriandolo {
            animation-play-state: paused;
        }

        .coriandolo {
            position: absolute;
            top: 0;
            width: 8px;
            height: 13px;
            opacity: 0;
            animation-name: cade;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes cade {
            0%   { transform: translate(0, -12vh) rotate(0deg);          opacity: 0; }
            8%   { opacity: 1; }
            50%  { transform: translate(var(--deriva), 45vh) rotate(400deg); }
            92%  { opacity: 1; }
            100% { transform: translate(0, 108vh) rotate(880deg);        opacity: 0; }
        }

        /* Chi ha chiesto meno animazioni riceve la scritta e le frecce ferme,
           e nessun coriandolo: una pioggia immobile a mezz'aria sarebbe solo
           una macchia di colore senza senso. */
        @media (prefers-reduced-motion: reduce) {
            #suggerimento,
            #suggerimento *,
            #conto-titolo * {
                animation: none;
            }

            #coriandoli {
                display: none;
            }
        }

        .train-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .train-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div id="mainContainer">
        <!-- Pagina 1: Meteo e Treni -->
        <div class="page screen-1" id="page1">
            <div class="blogpost">
                <div class="meteo-container">
                    <!-- Radar precipitazioni -->
                    <div style="margin-bottom: 10px;">
                        <button class="toggle-btn radar" onclick="protezionecivile()">🌧️</button>
                    </div>

                    <!-- Bottoni meteo -->
                    <div class="buttons-container" id="meteoButtons">
                        <button class="toggle-btn" id="btnFirenze" onclick="toggleWidget('firenze')">
                            <span>FI</span>
                        </button>
                        <button class="toggle-btn" id="btnMontelupo" onclick="toggleWidget('montelupo')">
                            <span>M</span>
                        </button>
                        <button class="toggle-btn" id="btnPisa" onclick="toggleWidget('pisa')">
                            <span>PI</span>
                        </button>
                    </div>

                    <!-- Widget meteo -->
                    <div id="widgetFirenze" class="widget-wrapper">
                        <iframe loading="lazy" src="https://www.3bmeteo.com/moduli_esterni/localita_7_giorni_orario/2798/ffffff/1a5fb4/241f31/ffffff/it" width="382" height="497" frameborder="0"></iframe>
                    </div>
                    <div id="widgetMontelupo" class="widget-wrapper">
                        <iframe loading="lazy" src="https://www.3bmeteo.com/moduli_esterni/localita_7_giorni_orario/4376/ffffff/1a5fb4/241f31/ffffff/it" width="382" height="497" frameborder="0"></iframe>
                    </div>
                    <div id="widgetPisa" class="widget-wrapper">
                        <iframe loading="lazy" src="https://www.3bmeteo.com/moduli_esterni/localita_7_giorni_orario/5282/ffffff/1a5fb4/241f31/ffffff/it" width="382" height="497" frameborder="0"></iframe>
                    </div>

                    <!-- Sezione Treni -->
                    <div class="train-section">
                        <div class="train-row">
                            <button class="toggle-btn train-btn" onclick="apriStazione('S06511', 'MONTELUPO CAPRAIA')">
                                <span>Montelupo</span>
                            </button>
                        </div>
                        <div class="train-row">
                            <button class="toggle-btn train-btn" onclick="apriStazione('S06500', 'PISA CENTRALE')">
                                <span>Pisa Centrale</span>
                            </button>
                            <button class="toggle-btn train-btn" onclick="apriStazione('S06421', 'FIRENZE S.M.NOVELLA')">
                                <span>Firenze SMN</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="suggerimento" aria-hidden="true">
                <span class="scritta">
                    <span class="scintilla">✨</span><span class="invito">scorri giù</span><span class="scintilla">🎉</span>
                </span>
                <div class="ventaglio">
                    <svg style="--storto: -34deg" viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,2 12,10 22,2"></polyline></svg>
                    <svg style="--storto: -17deg" viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,2 12,10 22,2"></polyline></svg>
                    <svg style="--storto: 0deg"   viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,2 12,10 22,2"></polyline></svg>
                    <svg style="--storto: 17deg"  viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,2 12,10 22,2"></polyline></svg>
                    <svg style="--storto: 34deg"  viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,2 12,10 22,2"></polyline></svg>
                </div>
            </div>
        </div>

        <!-- Pagina 2: Conto alla rovescia -->
        <div class="page screen-2" id="page2">
            <div id="coriandoli" class="in-pausa" aria-hidden="true"></div>
            <div id="conto">
                <h1 id="conto-titolo" aria-label="Incontro con Leo"><span class="emoji">🎉</span><span class="titolo-testo">Incontro con Leo</span><span class="emoji">🎊</span></h1>
                <div id="conto-cifre">
                    <div class="unita"><span class="numero" id="cd-giorni">--</span><span class="etichetta">giorni</span></div>
                    <div class="unita"><span class="numero" id="cd-ore">--</span><span class="etichetta">ore</span></div>
                    <div class="unita"><span class="numero" id="cd-minuti">--</span><span class="etichetta">minuti</span></div>
                    <div class="unita"><span class="numero" id="cd-secondi">--</span><span class="etichetta">secondi</span></div>
                </div>
                <p id="conto-finito" hidden>È arrivato il momento.</p>
            </div>
        </div>
    </div>

    <script>
        // Registra Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .catch(err => console.log('SW registration failed:', err));
        }

        const pagine = [
            document.getElementById('page1'),
            document.getElementById('page2')
        ];
        const container = document.getElementById('mainContainer');
        const suggerimento = document.getElementById('suggerimento');

        let indicePagina = 0;
        let startY = 0;
        let isDragging = false;
        const SWIPE_THRESHOLD = 80;
        const RESISTANCE_FACTOR = 0.4;

        // scostamento: il trascinamento in corso, in px. A riposo vale 0.
        function posiziona(scostamento = 0) {
            const quota = scostamento / window.innerHeight;   // in unità di schermo
            pagine.forEach((pagina, i) => {
                const distanza = (i - indicePagina) + quota;  // 0 = perfettamente in vista
                pagina.style.transform = `translateY(${distanza * 100}%)`;
                pagina.style.opacity = Math.max(0, 1 - Math.abs(distanza));
                // Le pagine fuori vista sono trasparenti ma resterebbero cliccabili:
                // senza questa riga si premerebbero al buio i bottoni del meteo.
                pagina.style.pointerEvents = i === indicePagina ? 'auto' : 'none';
            });
        }

        // Durante il trascinamento le pagine devono seguire il dito senza
        // interpolazione, altrimenti arrivano in ritardo di 0,4s.
        function conAnimazione(attiva) {
            pagine.forEach(p => { p.style.transition = attiva ? '' : 'none'; });
        }

        function vaiA(nuovoIndice) {
            indicePagina = nuovoIndice;
            // Chi è già sceso una volta non ha più bisogno dell'invito, e i
            // coriandoli non hanno ragione di cadere dove nessuno li guarda.
            suggerimento.classList.toggle('via', indicePagina !== 0);
            coriandoli.classList.toggle('in-pausa', indicePagina !== 1);
            // 'exiting' accorcia la dissolvenza di chi esce: senza, la pagina
            // vecchia resta visibile troppo a lungo sopra quella nuova.
            pagine.forEach(p => p.classList.add('exiting'));
            conAnimazione(true);
            posiziona();
            setTimeout(() => pagine.forEach(p => p.classList.remove('exiting')), 400);
        }

        // Touch events
        container.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
        });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;

            const deltaY = e.touches[0].clientY - startY;

            if (Math.abs(deltaY) > 10) e.preventDefault();

            // Ai due capi della fila non c'è niente da scoprire: il trascinamento
            // non risponde, invece di mostrare il vuoto oltre l'ultima pagina.
            const primaInAlto = indicePagina === 0 && deltaY > 0;
            const ultimaInBasso = indicePagina === pagine.length - 1 && deltaY < 0;
            if (primaInAlto || ultimaInBasso) return;

            conAnimazione(false);
            posiziona(deltaY * RESISTANCE_FACTOR);
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;

            const deltaY = e.changedTouches[0].clientY - startY;
            conAnimazione(true);

            if (deltaY < -SWIPE_THRESHOLD && indicePagina < pagine.length - 1) {
                vaiA(indicePagina + 1);
            } else if (deltaY > SWIPE_THRESHOLD && indicePagina > 0) {
                vaiA(indicePagina - 1);
            } else {
                posiziona();
            }
        });

        // Wheel events
        let wheelTimeout;
        container.addEventListener('wheel', (e) => {
            e.preventDefault();

            clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
                if (e.deltaY > 50 && indicePagina < pagine.length - 1) {
                    vaiA(indicePagina + 1);
                } else if (e.deltaY < -50 && indicePagina > 0) {
                    vaiA(indicePagina - 1);
                }
            }, 50);
        }, { passive: false });

        posiziona();

        // ==== Conto alla rovescia =======================================
        // Il traguardo si porta dietro il fuso (+02:00, l'ora legale in vigore
        // il 30 settembre 2026): scritto senza, ogni dispositivo lo leggerebbe
        // nel proprio, e il conto finirebbe a ore diverse a seconda di dove ci
        // si trova. Così le 9 sono le 9 italiane per tutti.
        const TRAGUARDO = new Date('2026-09-30T09:00:00+02:00');

        const cifre = {
            giorni: document.getElementById('cd-giorni'),
            ore: document.getElementById('cd-ore'),
            minuti: document.getElementById('cd-minuti'),
            secondi: document.getElementById('cd-secondi')
        };
        const grigliaConto = document.getElementById('conto-cifre');
        const messaggioFinale = document.getElementById('conto-finito');

        function aggiornaConto() {
            const mancante = TRAGUARDO - new Date();

            if (mancante <= 0) {
                grigliaConto.hidden = true;
                messaggioFinale.hidden = false;
                clearInterval(battito);
                return;
            }

            const totale = Math.floor(mancante / 1000);
            cifre.giorni.textContent = Math.floor(totale / 86400);
            cifre.ore.textContent = String(Math.floor(totale / 3600) % 24).padStart(2, '0');
            cifre.minuti.textContent = String(Math.floor(totale / 60) % 60).padStart(2, '0');
            cifre.secondi.textContent = String(totale % 60).padStart(2, '0');
        }

        const battito = setInterval(aggiornaConto, 1000);
        aggiornaConto();

        // ==== Festa ======================================================
        const COLORI_FESTA = ['#3584e4', '#9141ac', '#ff00a0', '#e01b24',
                              '#ff7800', '#f6d32d', '#33d17a'];

        // Spezza una scritta lettera per lettera, ognuna con il suo colore e
        // il suo ritardo: è il ritardo crescente a far correre l'onda lungo
        // la parola invece di farla saltare tutta insieme. Gli spazi restano
        // testo semplice, così le parole non si attaccano.
        function scomponi(elemento) {
            const testo = elemento.textContent;
            elemento.textContent = '';
            [...testo].forEach((carattere, i) => {
                if (carattere === ' ') {
                    elemento.appendChild(document.createTextNode(' '));
                    return;
                }
                const lettera = document.createElement('span');
                lettera.className = 'lettera';
                lettera.textContent = carattere;
                lettera.style.color = COLORI_FESTA[i % COLORI_FESTA.length];
                lettera.style.animationDelay = (i * 0.07).toFixed(2) + 's';
                elemento.appendChild(lettera);
            });
        }

        document.querySelectorAll('.invito, .titolo-testo').forEach(scomponi);

        // I coriandoli si fabbricano qui e non in HTML: sono quaranta, e
        // scritti a mano sarebbero quaranta righe tutte uguali tranne i
        // numeri — che sono poi l'unica cosa che conta, perché è il caso a
        // impedire alla pioggia di scendere in formazione.
        const coriandoli = document.getElementById('coriandoli');
        const caso = (min, max) => min + Math.random() * (max - min);

        for (let i = 0; i < 40; i++) {
            const pezzo = document.createElement('i');
            pezzo.className = 'coriandolo';
            pezzo.style.left = caso(0, 100).toFixed(2) + '%';
            pezzo.style.background = COLORI_FESTA[i % COLORI_FESTA.length];
            pezzo.style.setProperty('--deriva', caso(-40, 40).toFixed(1) + 'px');
            pezzo.style.animationDuration = caso(4, 9).toFixed(2) + 's';
            // Ritardi sparsi su tutta la durata: senza, i primi secondi
            // sarebbero un unico sbuffo e poi il vuoto.
            pezzo.style.animationDelay = '-' + caso(0, 9).toFixed(2) + 's';
            if (Math.random() < 0.35) pezzo.style.borderRadius = '50%';
            coriandoli.appendChild(pezzo);
        }

        function toggleWidget(city) {
            const widgets = {
                firenze: document.getElementById('widgetFirenze'),
                montelupo: document.getElementById('widgetMontelupo'),
                pisa: document.getElementById('widgetPisa')
            };

            const buttons = {
                firenze: document.getElementById('btnFirenze'),
                montelupo: document.getElementById('btnMontelupo'),
                pisa: document.getElementById('btnPisa')
            };

            const isCurrentlyShowing = widgets[city].classList.contains('show');

            // Chiudi tutti i widget e rimuovi active da tutti i bottoni
            Object.values(widgets).forEach(w => w.classList.remove('show'));
            Object.values(buttons).forEach(b => b.classList.remove('active'));

            // Se non era già aperto, aprilo
            if (!isCurrentlyShowing) {
                widgets[city].classList.add('show');
                buttons[city].classList.add('active');
            }
        }

        function apriStazione(codiceStazione, nomeStazione) {
            window.location.href = `http://www.viaggiatreno.it/infomobilitamobile/pages/cercaTreno/cercaTreno.jsp?cod=${codiceStazione}&nome=${encodeURIComponent(nomeStazione)}`;
        }

        function protezionecivile() {
            window.location.href = `https://radar.protezionecivile.it/`;
        }
    </script>
</body>
</html>
